name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      # Stockfish is intentionally NOT installed here — apt-get install is slow
      # and engine-dependent tests skip cleanly without it. Run engine tests
      # locally (Stockfish bundled in the app image) before opening a PR.
      - name: Run tests
        run: pytest --cov=chessapp --cov-report=term-missing

  # Non-blocking vendored-file drift check (agent-standard master plan §11):
  # clones the canonical agent-standard repo next to this checkout and runs
  # check-sync.sh; drift surfaces as a warning annotation, never a failure.
  # This checkout doubles as the canonical voice-module source, so only
  # agent-standard is cloned. Runs on the homelab runner because the repo is
  # private — the default GITHUB_TOKEN is single-repo, but the runner's gh
  # credential helper can clone it.
  sync-check:
    runs-on: [self-hosted, homelab]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: check-sync (warn only)
        run: |
          layout="$RUNNER_TEMP/check-sync"
          rm -rf "$layout" && mkdir -p "$layout"
          git clone --depth 1 https://github.com/ryanskarnulis/agent-standard "$layout/agent-standard"
          cp -r "$GITHUB_WORKSPACE" "$layout/chess"
          if ! "$layout/agent-standard/check-sync.sh"; then
            echo "::warning title=Vendored-file drift::check-sync.sh found drift against the canonical files — re-copy per the re-vendor rule (see job log)."
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
