# Workspace app manifest — consumed by gateway/gen.py (and later the hub app).
# Schema reference: ../gateway/README.md
name: chess
title: Chess
description: Play against a tool-using AI agent — voice-first, with personalities.
icon: "♞"
upstream: 127.0.0.1:8000
health: /api/state
lan: true
runtime:
  type: compose
  start: docker compose up -d
  stop: docker compose down
  notes: "LLM brain is the shared ../llama-swap stack and optional: with it down the app runs engine-only."
tags: [game, ai]
# Delegate agent manifest (../agent-standard/app-yaml-agent-block.md) —
# consumed by conductor to build this app's delegate tool; gen.py ignores it.
agent:
  description: "Plays chess: makes moves, analyzes positions, controls the game (new game, undo, resign, save/resume), and adjusts difficulty."
  api: /api/agent
  examples:
    - "move my knight to f3"
    - "how am I doing in this game?"
    - "castle kingside"
    - "set the chess difficulty to easy"
    - "start a new chess game"
