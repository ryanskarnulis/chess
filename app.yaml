# Workspace app manifest — consumed by gateway/gen.py (and later the hub app).
# Schema reference: ../gateway/README.md
name: chess
title: Chess
description: Play against a tool-using AI agent — voice-first, with a dialed-in personality (Glitch).
icon: "♞"
upstream: 127.0.0.1:8000
health: /api/state
lan: true
runtime:
  type: compose
  start: docker compose up -d
  stop: docker compose down
  notes: "LLM brain is the shared ../llama-swap stack and optional: with it down the app runs engine-only."
tags: [game, ai]
# Handoff manifest (../agent-standard/app-yaml-open-block.md) — consumed by
# conductor to build this app's open/redirect tool; gen.py ignores it.
#
# Deliberately NO `agent:` block. Chess is a board you play *in*: relaying
# moves through the conductor's chat panel is a worse game than the app
# itself, so conductor hands the user over (`open_chess`) instead of
# delegating (`ask_chess`). /api/agent hosts only the glance conductor reads
# (`look`); the conversation endpoints were retired in #565.
open:
  description: "Opens the chess board in the browser and starts a session with the chess agent. Use this for anything to do with playing, watching, resetting, resigning or otherwise changing a chess game ('the game' always means this one) — you do not play chess yourself, you hand the user to the board."
  path: /
  # The user's own words ride along as this query param; chess runs them
  # through its agent on load. Omit the key to hand off with no intent.
  intent_param: intent
  examples:
    - "let's play chess"
    - "start a new chess game"
    - "move my knight to f3"
    - "how am I doing in this game?"
    - "resign the game"
# One read-only summary for conductor's look(chess) (../agent-standard/
# app-yaml-glance-block.md): no model call, no engine search.
glance:
  holds: "The chess game in progress (whose move, how far, the material balance) and the last finished game (result, opening, date). No engine evaluation."
  path: /api/agent/glance
