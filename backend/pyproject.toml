[project]
name = "chessapp"
version = "0.1.0"
description = "Local agent-first chess app"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11",
    "jsonschema>=4",
    "fastapi>=0.115",
    "openai>=1.40",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    # uvicorn's WebSocket support needs a ws library it doesn't require by
    # default; without one in the image, /ws answers 404 and live board sync
    # silently dies (TestClient never exercises this layer, so tests alone
    # stay green).
    "websockets>=13",
]

[project.scripts]
chessapp = "chessapp.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chessapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
