[project]
name = "chessapp"
version = "0.1.0"
description = "Local agent-first chess app"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11",
    "jsonschema>=4",
    # Tool argument schemas are derived from typed signatures via FastMCP's
    # func_metadata (the workspace agent standard; see agent-standard/STANDARD.md
    # §1). Pulls in pydantic, which fastapi already requires.
    # <2 because mcp 2.0.0 (released 2026-07-28) drops `mcp.server.fastmcp` —
    # every import in the app and the test suite dies at collection on it
    # (first seen as CI-only red on PR #194; local venvs still held 1.x).
    # Migrating to the 2.x shape is its own slice, not a pin's.
    "mcp>=1.20.0,<2",
    "fastapi>=0.115",
    # The LLM brain speaks the OpenAI chat wire to llama-server over plain
    # httpx (chessapp.provider), and voice speaks the OpenAI audio wire the
    # same way (chessapp.voice, per agent-standard/voice.md) — no SDK.
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    # uvicorn's WebSocket support needs a ws library it doesn't require by
    # default; without one in the image, /ws answers 404 and live board sync
    # silently dies (TestClient never exercises this layer, so tests alone
    # stay green).
    "websockets>=13",
]

[project.scripts]
chessapp = "chessapp.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # The MCP server tests drive FastMCP's async ClientSession over an
    # in-memory transport (the real request/validation/serialization path,
    # per the workspace agent standard; see agent-standard/STANDARD.md §1).
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chessapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
