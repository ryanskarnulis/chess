# gemma-4-12b-agentic-v2: #298 bake-off candidate (docs/model-profiles.md).
# yuxinlu1's tool-use fine-tune of gemma-4-12B-it (Q6_K), served by
# ../llama-swap/config.yaml's entry of the same name (-ngl 46 + the base
# 12B's MTP drafter, ~37 tok/s, -c 32768).
#
# Starting values, not measurements: nothing here has been run through the
# gate yet. Replace each with what the bake-off measures, and say so.
thinking_kwarg = "enable_thinking"

quirks = [
    # The card asks for thinking on (its training default); the shipped
    # planner call runs every model with it off.
    "Trained to think by default; the planner runs it with thinking off.",
    # The profile cannot send repeat_penalty; the card's fix for "0000..."
    # loops is set as the server default in the llama-swap entry.
    "repeat_penalty 1.1 comes from the llama-swap entry, not this profile.",
    # One narrator-shaped sample each way, 2026-10-07 (#298 setup).
    "A thinking narrator turn ran 200 tokens (~9 s); thinking off, ~35 tokens.",
]

# The 12B's crutches, carried over so the default arm is like-for-like with
# gemma-4-12b. #298 runs each candidate with and without them
# (CHESSAPP_CRUTCHES=none); a model that holds the gate without them ships
# without them.
crutches = [
    "move_source_required",
    "undo_call_again",
    "ask_player_examples",
    "pick_resubmit_script",
    "difficulty_constraint_rule",
]

# The fine-tune card's sampling, which is Gemma 4's published set, the same
# as gemma-4-12b's.
[sampling]
temperature = 1.0
top_p = 0.95
top_k = 64

# Carried from gemma-4-12b (#286: a parse wants the mode); not yet measured
# on this model. Caps are the 12B's until a trace says otherwise.
[phases.planner]
temperature = 0.3
max_tokens = 2048

[phases.narrator]
max_tokens = 4096

[phases.answer]
max_tokens = 16
