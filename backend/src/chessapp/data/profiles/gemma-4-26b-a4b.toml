# gemma-4-26b-a4b: #298 bake-off candidate (docs/model-profiles.md). The
# 26B-A4B MoE sibling of gemma-4-12b — same family, chat template and
# thinking toggle — served by ../llama-swap/config.yaml's entry of the same
# name (QAT UD-Q4_K_XL, -ncmoe 17 + MTP drafter, ~60 tok/s).
#
# The planner's settings and the crutches are measured (below); the rest
# are starting values. Replace each with what the bake-off measures.
thinking_kwarg = "enable_thinking"

quirks = [
    # One narrator-shaped sample each way, 2026-10-03 (#298 setup).
    "A thinking narrator turn ran 504 tokens (~10 s); thinking off, ~30 tokens.",
]

# Three of the 12B's five crutches, measured 2026-10-08 (#432) with the
# thinking planner, each set against all five on one server, paired seeds:
# - probe_planner, 26 dev items x 5: all five 118/130, none 107/130. On the
#   six items that moved: only ask_player_examples + move_source_required
#   28/30, all five 26/30, without ask_player_examples 23/30 (the pawn ask
#   split into two ask_player calls), without move_source_required 24/30
#   (ordinal_stale played Nf3 with no source).
# - Full gate, two alternating blocks of 5: those two alone held everything
#   but constraint_rules_out_the_only_lever, 10/10 -> 6/10 (it changed the
#   difficulty or verbosity the player had ruled out), so
#   difficulty_constraint_rule stays. undo_and_replace and
#   undo_twice_and_replace were 10/10 without undo_call_again.
# - Frontier undo_then_ambiguous_bishop (dev, 2 x 10): without
#   pick_resubmit_script 13/20, with it 10/20 (p=0.51).
crutches = [
    "move_source_required",
    "ask_player_examples",
    "difficulty_constraint_rule",
]

# Gemma 4's published sampling, as the GGUF carries it (general.sampling.*)
# and as gemma-4-12b uses — the same family's numbers.
[sampling]
temperature = 1.0
top_p = 0.95
top_k = 64

# The planner thinks (#298). Measured 2026-10-07 with probe_planner on its
# 26 dev items, interleaved with gemma-4-12b: thinking on, 50/52 at a median
# 8.5 s per call (p90 24 s); thinking off, 207/260 (80%) against the 12B's
# 219/260. Thinking is what fixed the pawn asks every thinking-off model
# missed. Its thoughts ran a median 418 tokens, 1,772 at the longest real
# one, and one call hit the old 2,048 cap without calling a tool, so the cap
# is 4,096: about 70 s at ~60 tok/s, near the 60 s planning deadline.
# Temperature 0.3 is carried from gemma-4-12b (#286), not re-measured here.
[phases.planner]
temperature = 0.3
max_tokens = 4096
thinking = true

[phases.narrator]
max_tokens = 4096

[phases.answer]
max_tokens = 16
