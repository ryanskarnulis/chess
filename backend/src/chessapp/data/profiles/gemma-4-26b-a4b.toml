# gemma-4-26b-a4b: #298 bake-off candidate (docs/model-profiles.md). The
# 26B-A4B MoE sibling of gemma-4-12b — same family, chat template and
# thinking toggle — served by ../llama-swap/config.yaml's entry of the same
# name (QAT UD-Q4_K_XL, -ncmoe 17 + MTP drafter, ~60 tok/s).
#
# The planner's settings are measured (below); the rest are starting values
# until the gate has run. Replace each with what the bake-off measures.
thinking_kwarg = "enable_thinking"

quirks = [
    # One narrator-shaped sample each way, 2026-10-03 (#298 setup).
    "A thinking narrator turn ran 504 tokens (~10 s); thinking off, ~30 tokens.",
]

# The 12B's crutches, carried over so the default arm is like-for-like with
# gemma-4-12b. #298 runs each candidate with and without them
# (CHESSAPP_CRUTCHES=none); a model that holds the gate without them ships
# without them.
crutches = [
    "move_source_required",
    "undo_call_again",
    "ask_player_examples",
    "pick_resubmit_script",
    "difficulty_constraint_rule",
]

# Gemma 4's published sampling, as the GGUF carries it (general.sampling.*)
# and as gemma-4-12b uses — the same family's numbers.
[sampling]
temperature = 1.0
top_p = 0.95
top_k = 64

# The planner thinks (#298). Measured 2026-10-07 with probe_planner on its
# 26 dev items, interleaved with gemma-4-12b: thinking on, 50/52 at a median
# 8.5 s per call (p90 24 s); thinking off, 207/260 (80%) against the 12B's
# 219/260. Thinking is what fixed the pawn asks every thinking-off model
# missed. Its thoughts ran a median 418 tokens, 1,772 at the longest real
# one, and one call hit the old 2,048 cap without calling a tool, so the cap
# is 4,096: about 70 s at ~60 tok/s, near the 60 s planning deadline.
# Temperature 0.3 is carried from gemma-4-12b (#286), not re-measured here.
[phases.planner]
temperature = 0.3
max_tokens = 4096
thinking = true

[phases.narrator]
max_tokens = 4096

[phases.answer]
max_tokens = 16
