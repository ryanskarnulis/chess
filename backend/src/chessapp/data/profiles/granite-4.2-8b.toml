# granite-4.2-8b: #298 bake-off candidate (docs/model-profiles.md). IBM
# Granite 4.2 8B, dense, RL-trained for tool calling, served by
# ../llama-swap/config.yaml's entry of the same name (Q8_0, -ngl 37,
# ~21 tok/s, -c 32768).
#
# Starting values, not measurements: nothing here has been run through the
# gate yet. Replace each with what the bake-off measures, and say so.
thinking_kwarg = "enable_thinking"

quirks = [
    # IBM's card: temperature 1.0 / top_p 0.95 for every mode, tool calling
    # included. It publishes no top_k, so none is sent (server default).
    "IBM asks for temperature 1.0 in every mode; the planner's 0.3 departs from that.",
    # One narrator-shaped sample each way, 2026-10-03 (#298 setup).
    "A thinking narrator turn ran 357 tokens (~17 s); thinking off, ~50 tokens.",
]

# The 12B's crutches, carried over so the default arm is like-for-like with
# gemma-4-12b. #298 runs each candidate with and without them
# (CHESSAPP_CRUTCHES=none); a model that holds the gate without them ships
# without them.
crutches = [
    "move_source_required",
    "undo_call_again",
    "ask_player_examples",
    "pick_resubmit_script",
    "difficulty_constraint_rule",
]

# IBM's published sampling for Granite 4.2.
[sampling]
temperature = 1.0
top_p = 0.95

# Carried from gemma-4-12b (#286: a parse wants the mode); not yet measured
# on this model. Caps are the 12B's until a trace says otherwise.
[phases.planner]
temperature = 0.3
max_tokens = 2048

[phases.narrator]
max_tokens = 4096

[phases.answer]
max_tokens = 16
