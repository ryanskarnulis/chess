# ornith-1.5-35b-a3b: #298 bake-off candidate (docs/model-profiles.md).
# Ornith-1.5-35B-A3B, an RL-trained agentic model on the Qwen3.5 MoE base,
# served by ../llama-swap/config.yaml's entry of the same name (Q4_K_M,
# -ncmoe 28, no MTP, ~50 tok/s).
#
# Starting values, not measurements: nothing here has been run through the
# gate yet. Replace each with what the bake-off measures, and say so.
thinking_kwarg = "enable_thinking"

quirks = [
    # Ornith's card: a reasoning model whose turn opens with <think> by
    # default; the shipped planner call runs every model with it off.
    "A reasoning model, thinking on by default; the planner runs it with thinking off.",
    # One narrator-shaped sample each way, 2026-10-07 (#298 setup).
    "A thinking narrator turn ran 331 tokens (~8 s); thinking off, ~45 tokens.",
]

# The 12B's crutches, carried over so the default arm is like-for-like with
# gemma-4-12b. #298 runs each candidate with and without them
# (CHESSAPP_CRUTCHES=none); a model that holds the gate without them ships
# without them.
crutches = [
    "move_source_required",
    "undo_call_again",
    "ask_player_examples",
    "pick_resubmit_script",
    "difficulty_constraint_rule",
]

# Ornith's recommended sampling "for general tasks". It publishes no top_k,
# so none is sent (server default).
[sampling]
temperature = 0.6
top_p = 0.95

# Carried from gemma-4-12b (#286: a parse wants the mode); not yet measured
# on this model. Caps are the 12B's until a trace says otherwise.
[phases.planner]
temperature = 0.3
max_tokens = 2048

[phases.narrator]
max_tokens = 4096

[phases.answer]
max_tokens = 16
