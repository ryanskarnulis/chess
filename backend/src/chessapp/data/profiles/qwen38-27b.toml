# qwen38-27b: the picker's "Deep" brain (#436, docs/model-profiles.md).
# Qwen3.8-27B, dense, served by ../llama-swap/config.yaml's entry of the same
# name (GSQ-RCO IQ3_S, -ngl 48, ~8 tok/s, prefill ~400 tok/s, -c 32768, one
# slot).
#
# An option the player picks, not the default, so by Ryan's call it joined
# BRAIN_CHOICES without a gate run: the planner's thinking and the narrator's
# analysis_thinking are measured (below); the crutches and the rest are
# starting values. Replace each with what a gate measures, and say so.
thinking_kwarg = "enable_thinking"
# Qwen3.8's template reads a thinking level: `xhigh` (its default, with an
# instruction to validate assumptions and weigh alternatives), `medium`, or
# `low` ("keep your thinking brief"). The mover (#476) and the planner (#490)
# set one; the narrator never thinks, so it has none to set.
effort_kwarg = "reasoning_effort"

quirks = [
    # A profile has one sampling set, and the app thinks on only a few
    # narrator turns, so it gets the non-thinking set. Qwen publishes
    # 1.0 / 0.95 / 20 for thinking mode.
    "Sampling is Qwen's non-thinking set; thinking turns run on it too.",
    # The profile cannot send presence_penalty; llama-swap's cmd sets 1.5,
    # Qwen's non-thinking value, as the server default.
    "presence_penalty 1.5 comes from the llama-swap entry, not this profile.",
    # One narrator-shaped sample each way, 2026-10-03 (#298 setup). At
    # ~8 tok/s a thinking turn is the live-feel risk, not the cap.
    "A thinking narrator turn ran 727 tokens (~93 s); thinking off, ~45 tokens (~7 s warm).",
]

# The 12B's crutches, carried over unmeasured: no with/without arm has run on
# this model (on the 26B's thinking planner some helped and some hurt,
# #432). Measure with CHESSAPP_CRUTCHES=none before dropping any.
crutches = [
    "move_source_required",
    "undo_call_again",
    "ask_player_examples",
    "pick_resubmit_script",
    "difficulty_constraint_rule",
]

# Qwen3.8's published non-thinking (instruct) sampling.
[sampling]
temperature = 0.7
top_p = 0.8
top_k = 20

# The planner thinks (#436). Measured 2026-10-07 with probe_planner on its 26
# dev items, interleaved with gemma-4-12b and gemma-4-26b-a4b: thinking on,
# 51/52 (the best of the bake-off) at a median 30 s per call, p90 74 s, the
# longest 271 s (its one 2,048-token cap hit); thinking off, 152/260 (58%).
# The cap stays 2,048: at ~8 tok/s that is ~256 s, just inside the provider's
# 300 s read timeout, so a bigger one would end a runaway on the timeout
# instead of the cap. Temperature 0.3 is carried from gemma-4-12b (#286).
#
# `effort = "low"` (#490): probe_planner on the 26 dev items, 2026-10-11,
# arms interleaved per sample. xhigh (the template's default, no level sent)
# 52/52 at a median 43 s per call, p90 106 s, longest 212 s, median 233
# completion tokens; low 52/52 at 32 s, p90 47 s, longest 121 s, 159 tokens;
# medium 25/26 at 40 s, p90 55 s (one sample). No accuracy lost, and the slow
# tail more than halved. Probe only: no gate run.
[phases.planner]
temperature = 0.3
max_tokens = 2048
thinking = true
effort = "low"

# The narrator never thinks, even about an analysis result (#440's key): one
# thinking narrator sample ran 727 tokens, ~93 s, past the 60 s narration
# ceiling; thinking off, ~7 s.
[phases.narrator]
max_tokens = 4096
analysis_thinking = false

[phases.answer]
max_tokens = 16

# Glitch's own move in the tier where the model picks it (#472,
# docs/glitch-difficulty.md). At ~8 tok/s 2048 tokens is ~256 s. A think that
# ran to the cap would end without a move, so `thinking_budget` closes the
# thought at 1024 tokens and the model must call play_move (512 probed at
# ~80 s; the budget sets the strength, so it stays). The Deep brain plays
# slower by design; the picker says so.
#
# `deadline_s` covers the whole run, every retry included. The #476 strength
# run measured one call at p50 157 s, p90 164 s, so at 300 s an illegal try
# could not be retried and fell back to Stockfish (#489). 360 s fits two p90
# calls (328 s) with room for the retry's slightly longer prompt.
#
# `effort = "low"`: probed on two midgame positions (#476), every level spent
# the whole 1024 budget (~150 s), so the level saves no time; low with no
# budget ran to the 2048 cap with no move. Low is chosen because a thought
# the budget will cut short is better told to be brief than to weigh every
# alternative. Two positions say nothing about strength; the strength script
# does.
[phases.mover]
max_tokens = 2048
thinking = true
thinking_budget = 1024
effort = "low"
deadline_s = 360
