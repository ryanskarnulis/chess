# Home-network deployment: one container per layer, tied together here.
#
#   app    — the FastAPI backend (chessapp) with the built frontend baked in
#            and served at / (same origin as the API, so the UI's relative
#            /api + /ws URLs need no proxy); Stockfish bundled in the image.
#            Owns board truth + the deterministic engine; reaches the brain
#            over the network at CHESSAPP_LLAMA_URL.
#   speaches — self-hosted STT+TTS (OpenAI-compatible). Optional: text/board
#            play works with it down.
#
# The LLM "brain" (Gemma-4 12B on llama.cpp, GPU) is no longer a service here:
# it lives in the workspace-level ../llama-swap/ stack, shared with
# project-command-center, and the app reaches it over host.docker.internal.
# The server flags (MTP, ctx, KV quant) are owned by ../llama-swap/config.yaml
# — BRIEF.md's model/quant choice still stands, but the serving flags moved.
# Optional as ever: the app plays a full deterministic game with the brain
# down or the llama-swap stack stopped.
#
# Basic gameplay must work fully offline; nothing here reaches the internet at
# runtime once the model GGUF is cached on the host.
#
#   docker compose up -d --build        # start the stack
#   docker compose up -d app            # same thing now — the brain is external

services:
  app:
    build:
      # Root context: the image needs backend/ (wheel) AND frontend/ (UI build).
      context: .
      dockerfile: backend/Dockerfile
    # Host-only bind: LAN traffic comes in through the workspace gateway
    # (chess.$HOMELAB_DOMAIN → 127.0.0.1:8000). Port block 8000-8099 belongs to
    # chess — see ../gateway/README.md for the registry.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Brain seam → the shared workspace llama-swap proxy on the host
      # (port block 8200, see ../gateway/README.md). The model name must match
      # a ../llama-swap/config.yaml entry. Unset/override to run the LLM off —
      # /api/command 503s, gameplay is fine.
      CHESSAPP_LLAMA_URL: http://host.docker.internal:8200/v1
      CHESSAPP_MODEL: gemma-4-12b
      # Voice seam: where the app proxies STT/TTS requests. Unset to run
      # voiceless — the voice endpoints 503, gameplay is untouched.
      CHESSAPP_SPEACHES_URL: http://speaches:8000/v1
      # Glitch's custom voice: TTS goes to the Kokoro container (a designed
      # blend, see the kokoro service note); STT stays on Speaches. Unset
      # CHESSAPP_TTS_URL to fall back to Speaches for both.
      CHESSAPP_TTS_URL: http://kokoro:8880/v1
      CHESSAPP_TTS_MODEL: kokoro
      CHESSAPP_TTS_VOICE: am_fenrir(2)+am_michael(1)
      # Stockfish path + host/port are baked into the image ENV; saved games
      # persist to a named volume so they survive `compose down`.
      CHESSAPP_SAVE_DIR: /data/saves
    volumes:
      - chess-saves:/data/saves
    # host.docker.internal → the host, where llama-swap publishes :8200. Same
    # mechanism PCC's backend uses; compose projects don't share a network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Image already ships a HEALTHCHECK (urllib against /api/state).

  # --- Phase 2 (Voice) ------------------------------------------------------
  # Speaches: one self-hosted, OpenAI-API-compatible STT+TTS container
  # (faster-whisper + Kokoro/Piper). CPU image on purpose: the shared GPU
  # server already fills the 12GB GPU when loaded, and whisper-small/Kokoro
  # are fine on CPU for single-user voice. Models are a one-time explicit install (they land in
  # the mounted cache — internet once, then fully local, same story as the
  # llama GGUF):
  #
  #   curl -X POST http://localhost:8020/v1/models/Systran%2Ffaster-whisper-small
  #   curl -X POST http://localhost:8020/v1/models/speaches-ai%2FKokoro-82M-v1.0-ONNX
  #
  # Optional like the brain: the app serves board + text play with this
  # container down (voice endpoints 503/502).
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    ports:
      # Published for host-side debugging only; the app proxies to it over the
      # internal network so the browser never needs this port.
      - "127.0.0.1:8020:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/home/ubuntu/.cache/huggingface
    restart: unless-stopped

  # Kokoro-FastAPI: serves Glitch's custom voice (Speaches can't blend or
  # clone — stock voices only). CPU image on purpose, same GPU story as
  # speaches; Kokoro-82M is realtime on CPU. The voice is a weighted blend of
  # stock Kokoro voices, expressed right in the OpenAI `voice` param (e.g.
  # "am_fenrir+am_michael" or "am_fenrir(2)+am_michael(1)") — swap
  # CHESSAPP_TTS_VOICE on the app service to retune; no state lives here.
  # Model weights download into the image volume on first start (internet
  # once, then fully local).
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.5.0
    ports:
      # Host-side debugging/auditioning only, like speaches. Port from the
      # chess block 8000-8099 (../gateway/README.md).
      - "127.0.0.1:8030:8880"
    restart: unless-stopped

volumes:
  chess-saves:
