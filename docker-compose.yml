# Home-network deployment: one container per layer, tied together here.
#
#   app    — the FastAPI backend (chessapp) with the built frontend baked in
#            and served at / (same origin as the API, so the UI's relative
#            /api + /ws URLs need no proxy); Stockfish bundled in the image.
#            Owns board truth + the deterministic engine; reaches the brain
#            over the network at CHESSAPP_LLAMA_URL.
#   llama  — the LLM "brain" (Gemma-4 12B on llama.cpp, GPU). Optional: the
#            app plays a full deterministic game with this container down.
#   speaches — self-hosted STT+TTS (OpenAI-compatible). Optional like llama:
#            text/board play works with it down.
#
# Basic gameplay must work fully offline; nothing here reaches the internet at
# runtime once the model GGUF is cached on the host (see the llama notes).
#
#   docker compose up -d --build        # start the stack
#   docker compose up -d app            # engine-only: skip the brain entirely

services:
  app:
    build:
      # Root context: the image needs backend/ (wheel) AND frontend/ (UI build).
      context: .
      dockerfile: backend/Dockerfile
    # Host-only bind: LAN traffic comes in through the workspace gateway
    # (chess.$HOMELAB_DOMAIN → 127.0.0.1:8000). Port block 8000-8099 belongs to
    # chess — see ../gateway/README.md for the registry.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Point the brain seam at the llama service on the compose network.
      # Unset/override to run the LLM off — /api/command 503s, gameplay is fine.
      CHESSAPP_LLAMA_URL: http://llama:8080/v1
      CHESSAPP_MODEL: gemma
      # Voice seam: where the app proxies STT/TTS requests. Unset to run
      # voiceless — the voice endpoints 503, gameplay is untouched.
      CHESSAPP_SPEACHES_URL: http://speaches:8000/v1
      # Stockfish path + host/port are baked into the image ENV; saved games
      # persist to a named volume so they survive `compose down`.
      CHESSAPP_SAVE_DIR: /data/saves
    volumes:
      - chess-saves:/data/saves
    # Ordering only, not a health gate: the app must not wait ~100s for the
    # model to load before it can serve an engine-only game.
    depends_on:
      - llama
    restart: unless-stopped
    # Image already ships a HEALTHCHECK (urllib against /api/state).

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    ports:
      # Published for host-side debugging (curl localhost:8010/health); the app
      # reaches it over the internal network regardless.
      - "127.0.0.1:8010:8080"
    volumes:
      # GOTCHA: -hf downloads to the HF cache layout, NOT ~/.cache/llama.cpp.
      # Mount the host HF cache or the ~14GB GGUF re-downloads on every start.
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    # Tuning below is for a 12GB GPU (RTX 3060), the verified dev/home box:
    # dense 12B (6.72GB) fully GPU-offloaded (-ngl 999), vision projector skipped
    # (chess is text-only). MTP speculative decoding IS enabled here — the 12B
    # ships a drafter (mtp-gemma-4-12B-it.gguf, auto-found by -hf), giving
    # ~94 tok/s on structured tool/move calls (75% draft acceptance). VRAM
    # ~10.2GB with MTP. A harmless "[spec] failed to measure draft model memory"
    # warning prints but MTP still works.
    #
    # --sleep-idle-seconds: the GPU is shared with host-side Ollama (PCC task
    # extraction) — without this, weights stay resident 24/7 and anything else
    # lands on CPU. After 10 idle minutes the server unloads weights + KV cache
    # and auto-reloads on the next request (~100s cold — the first command of a
    # new session is slow; mid-game is unaffected). Idleness counts inference
    # tasks only, so the /health probe below doesn't keep it awake.
    command: >
      -hf unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL
      --host 0.0.0.0 --port 8080
      -ngl 999 --no-mmproj -fa on
      --spec-type draft-mtp --spec-draft-n-max 4
      -c 8192
      --sleep-idle-seconds 600
      --jinja --temp 1.0 --top-p 0.95 --top-k 64
    # NVIDIA Container Toolkit must be installed on the host for GPU passthrough.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Model load is ~100s cold; give it a generous start_period before the
      # first failing probe counts against it.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    restart: unless-stopped

  # --- Phase 2 (Voice) ------------------------------------------------------
  # Speaches: one self-hosted, OpenAI-API-compatible STT+TTS container
  # (faster-whisper + Kokoro/Piper). CPU image on purpose: the llama service
  # already fills the 12GB GPU, and whisper-small/Kokoro are fine on CPU for
  # single-user voice. Models are a one-time explicit install (they land in
  # the mounted cache — internet once, then fully local, same story as the
  # llama GGUF):
  #
  #   curl -X POST http://localhost:8020/v1/models/Systran%2Ffaster-whisper-small
  #   curl -X POST http://localhost:8020/v1/models/speaches-ai%2FKokoro-82M-v1.0-ONNX
  #
  # Optional like llama: the app serves board + text play with this container
  # down (voice endpoints 503/502).
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    ports:
      # Published for host-side debugging only; the app proxies to it over the
      # internal network so the browser never needs this port.
      - "127.0.0.1:8020:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/home/ubuntu/.cache/huggingface
    restart: unless-stopped

volumes:
  chess-saves:
