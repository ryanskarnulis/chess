<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0a0c12}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; color: #e8edf5; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <dc-import name="Shell" game-active="{{yes}}" hint-size="390px,844px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(10,12,18,0.6)"></div>
  <section role="dialog" aria-label="Game" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 30px; background: #0f131d; border-top: 1px solid rgba(199,211,228,0.22); border-radius: 16px 16px 0 0; display: flex; flex-direction: column">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgba(199,211,228,0.35); margin-bottom: 14px"></span>
    <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #939db0">Game</h2>
    <button type="button" style="height: 54px; display: flex; align-items: center; padding: 0; background: none; border: none; border-bottom: 1px solid rgba(199,211,228,0.12); color: #e8edf5; font: 17px Inter, system-ui, sans-serif; text-align: left">New game</button>
    <button type="button" style="height: 54px; display: flex; align-items: center; gap: 8px; padding: 0; background: none; border: none; border-bottom: 1px solid rgba(199,211,228,0.12); color: #e8edf5; font: 17px Inter, system-ui, sans-serif; text-align: left"><span style="flex: 1">Copy PGN</span></button>
    <button type="button" style="height: 54px; display: flex; align-items: center; padding: 0; background: none; border: none; border-bottom: 1px solid rgba(199,211,228,0.12); color: #e8edf5; font: 17px Inter, system-ui, sans-serif; text-align: left">Offer draw</button>
    <button type="button" style="height: 54px; display: flex; align-items: center; padding: 0; background: none; border: none; color: #f28fa4; font: 17px Inter, system-ui, sans-serif; text-align: left">Resign…</button>
    <h2 style="margin: 18px 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #939db0">Glitch</h2>
    <button type="button" style="min-height: 54px; display: flex; align-items: center; gap: 8px; padding: 0; background: none; border: none; border-bottom: 1px solid rgba(199,211,228,0.12); color: #e8edf5; font: 17px Inter, system-ui, sans-serif; text-align: left"><span style="flex: 1">Difficulty</span><span style="color: #939db0">Intermediate</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#939db0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 6 5.5 6-5.5 6"></path></svg></button>
    <button type="button" style="min-height: 62px; display: flex; align-items: center; gap: 8px; padding: 0; background: none; border: none; border-bottom: 1px solid rgba(199,211,228,0.12); color: #e8edf5; font: 17px Inter, system-ui, sans-serif; text-align: left"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span>Brain</span><span style="font-size: 13px; color: #939db0">Thinks first: about 5–10 seconds a turn</span></span><span style="color: #939db0">Balanced</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#939db0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 6 5.5 6-5.5 6"></path></svg></button>
    <button type="button" role="switch" aria-checked="true" style="height: 54px; display: flex; align-items: center; padding: 0; background: none; border: none; color: #e8edf5; font: 17px Inter, system-ui, sans-serif; text-align: left"><span style="flex: 1">Speak replies aloud</span><span aria-hidden="true" style="width: 46px; height: 28px; border-radius: 14px; background: rgba(155,231,255,0.4); position: relative; flex: 0 0 auto"><span style="position: absolute; right: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #e8edf5"></span></span></button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true };
  }
}
</script>
</body>
</html>
