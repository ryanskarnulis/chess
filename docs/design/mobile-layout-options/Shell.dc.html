<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screen shell — refined layout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0a0c12}
a{color:#9be7ff}a:hover{color:#c7f3ff}
.night{background:url('/_blob/35d2afed168cd32f6b13a06fa78c5efd') top right / 343px auto no-repeat,radial-gradient(1100px 750px at 50% 38%, #131726 0%, #0a0c12 62%)}
.night input::placeholder{color:#939db0}
.night input:focus{outline:none}
</style>
</helmet>
<div class="night" style="isolation: isolate; width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; color: #e8edf5; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 18px; line-height: 26.1px">
  <main style="display: flex; flex-direction: column; gap: 7.2px; padding: 6px 18px 0">
    <form aria-label="Talk to Glitch" style="display: flex; align-items: center; gap: 10px; height: 52px">
      <a href="#" aria-label="Back to The Web" style="flex: 0 0 auto; width: 36px; height: 44px; display: flex; align-items: center; justify-content: flex-start"><img src="/_blob/694e669a9ee1111111eb2a0f72a89c1a" alt="" style="width: 28px; height: 28px; border-radius: 50%; display: block; opacity: 0.85"></a>
      <label style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; height: 44px; border-bottom: 1px solid rgba(199,211,228,0.22)">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Command</span>
        <input type="text" placeholder="Talk to Glitch…" style="flex: 1 1 auto; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 4px; font: 17px Inter, system-ui, sans-serif; color: #e8edf5; background: transparent; border: none">
        <button type="button" aria-label="Start hands-free" style="flex: 0 0 auto; width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; color: #9be7ff; background: none; border: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></button>
      </label>
    </form>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: flex-start; gap: 9px; min-height: 100px">
        <img src="/_blob/14e94373b1fa663fce5992bf00929da6" alt="" style="width: 72px; height: 72px; border-radius: 50%; flex: 0 0 auto">
        <div style="flex: 1; min-width: 0">
          <p role="status" style="{{bubbleStyle}}"><span aria-hidden="true" style="position: absolute; left: -7px; top: 16px; width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-right: 7px solid rgba(199,211,228,0.22)"></span><sc-for list="{{paragraphs}}" as="para" hint-placeholder-count="2"><span style="{{para.style}}">{{para.text}}</span></sc-for></p>
        </div>
      </div>
      <div aria-label="Captured by Glitch" style="display: flex; align-items: center; gap: 5px; min-height: 22px">
        <span aria-hidden="true" style="font-size: 20px; line-height: 1">{{glitchCaps}}</span>
      </div>
    </div>
    <div style="box-sizing: border-box; width: 356px; height: 356px; border: 1px solid rgba(199,211,228,0.22); border-radius: 4px; overflow: hidden">
      <dc-import name="Board" size="{{boardSize}}" fen="{{fen}}" last="{{last}}" check="{{check}}" hint-size="354px,354px"></dc-import>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; min-height: 22px">
      <span aria-label="Captured by you" style="font-size: 20px; line-height: 1">{{youCaps}}</span>
      <sc-if value="{{youAdv}}" hint-placeholder-val="{{false}}"><span style="font-weight: 700; color: #8fdcaa; font-size: 14px; line-height: 1">{{youAdv}}</span></sc-if>
      <sc-if value="{{status}}" hint-placeholder-val="{{false}}"><span role="status" style="{{statusStyle}}">{{status}}</span></sc-if>
      <sc-if value="{{resultsChip}}" hint-placeholder-val="{{false}}"><button type="button" style="flex: 0 0 auto; height: 28px; padding: 0 10px; background: none; color: #9be7ff; border: none; font: 600 15px Inter, system-ui, sans-serif">Results</button></sc-if>
    </div>
    <sc-if value="{{side}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; font-size: 16px; color: #939db0">
        <span>Playing as {{side}} ·</span>
        <button type="button" style="height: 44px; padding: 0 2px; background: none; border: none; color: #9be7ff; font: 600 16px Inter, system-ui, sans-serif">Switch to {{otherSide}}</button>
      </div>
    </sc-if>
    <div style="display: flex; align-items: center; width: 354px; height: 44px">
      <button type="button" aria-label="Previous move" style="{{backStyle}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 6-5.5 6 5.5 6"></path></svg></button>
      <div style="flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; display: flex; justify-content: flex-end">
        <sc-for list="{{moves}}" as="mv" hint-placeholder-count="6"><span style="margin-left: 8.1px"><sc-if value="{{mv.num}}" hint-placeholder-val="{{false}}"><span style="color: #939db0; margin-right: 3.6px">{{mv.num}}</span></sc-if><span style="{{mv.style}}">{{mv.san}}</span></span></sc-for>
      </div>
      <button type="button" aria-label="Next move" style="{{fwdStyle}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 6 5.5 6-5.5 6"></path></svg></button>
    </div>
  </main>
  <nav aria-label="Game controls" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; display: flex; justify-content: center; background: rgba(15,19,29,0.9); border-top: 1px solid rgba(199,211,228,0.22)">
    <button type="button" style="{{undoStyle}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h11a5 5 0 0 1 0 10h-6"></path><path d="m8 5-4 4 4 4"></path></svg>Undo</button>
    <button type="button" style="{{hintStyle}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 17h5"></path><path d="M10 20h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.4.3.5.7.5 1.1h6c0-.4.1-.8.5-1.1A6 6 0 0 0 12 3Z"></path></svg>Hint</button>
    <button type="button" style="{{gameStyle}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>Game</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fen":{"editor":null,"default":""},"last":{"editor":null,"default":"e8,g8"},"check":{"editor":null,"default":""},"bubble":{"editor":null,"default":"Castled. That knight on d4 is looking awfully lonely.\n\nO-O."},"thinking":{"editor":null,"default":false},"glitchCaps":{"editor":null,"default":"♟︎"},"youCaps":{"editor":null,"default":"♙︎"},"youAdv":{"editor":null,"default":""},"status":{"editor":null,"default":""},"statusAlert":{"editor":null,"default":false},"resultsChip":{"editor":null,"default":false},"side":{"editor":null,"default":""},"moves":{"editor":null,"default":null},"canBack":{"editor":null,"default":true},"canForward":{"editor":null,"default":false},"undoOff":{"editor":null,"default":false},"hintOff":{"editor":null,"default":false},"drawOff":{"editor":null,"default":false},"gameActive":{"editor":null,"default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var bubble = p.bubble ?? 'Castled. That knight on d4 is looking awfully lonely.\n\nO-O.';
    var thinking = !!p.thinking;
    var paragraphs = bubble.split(/\n{2,}/).map(function (text, i) {
      return { text: text, style: 'display:block' + (i > 0 ? ';margin-top:5.4px' : '') };
    });
    var defaultMoves = [
      { num: '6.', san: 'Be3' }, { san: 'e6' }, { num: '7.', san: 'Be2' }, { san: 'Be7' },
      { num: '8.', san: 'Qd2' }, { san: 'O-O', current: true }
    ];
    var moves = (p.moves || defaultMoves).map(function (m) {
      return { num: m.num || '', san: m.san, style: m.current ? 'color:#9be7ff;font-weight:600' : '' };
    });
    var bar = function (off, lit) {
      return 'flex:1;display:flex;flex-direction:column;align-items:center;gap:2.7px;padding:9px 0 10.8px;background:none;border:none;font:13.5px/normal Inter,system-ui,sans-serif;color:' + (lit ? '#9be7ff' : '#e8edf5') + (off ? ';opacity:0.35' : '');
    };
    var chevron = function (on, align) {
      return 'flex:0 0 auto;width:36px;height:44px;display:flex;align-items:center;justify-content:' + align + ';padding:0;background:none;border:none;color:' + (on ? '#e8edf5' : '#939db0') + (on ? '' : ';opacity:0.35');
    };
    var side = p.side || '';
    return {
      boardSize: 354,
      fen: p.fen || '',
      last: p.last ?? 'e8,g8',
      check: p.check || '',
      paragraphs: paragraphs,
      bubbleStyle: 'position:relative;margin:4.5px 0 0;padding:9px 13.5px;background:rgba(15,19,29,0.9);border:1px solid rgba(199,211,228,0.22);border-radius:12px;line-height:1.3' + (thinking ? ';color:#939db0;font-style:italic' : ''),
      glitchCaps: p.glitchCaps ?? '♟︎',
      youCaps: p.youCaps ?? '♙︎',
      youAdv: p.youAdv || '',
      status: p.status || '',
      statusStyle: 'margin-left:auto;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;' + (p.statusAlert ? 'color:#f28fa4;font-weight:600' : 'color:#939db0'),
      resultsChip: !!p.resultsChip,
      side: side,
      otherSide: side === 'White' ? 'Black' : 'White',
      moves: moves,
      backStyle: chevron(p.canBack ?? true, 'flex-start'),
      fwdStyle: chevron(!!p.canForward, 'flex-end'),
      undoStyle: bar(!!p.undoOff),
      hintStyle: bar(!!p.hintOff),
      gameStyle: bar(false, !!p.gameActive)
    };
  }
}
</script>
</body>
</html>
